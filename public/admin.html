<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin panelis — Matu studija</title>
  <meta name="theme-color" content="#F8F6EE">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232E3A2F'/%3E%3Cg fill='none' stroke='%23D9C9B2' stroke-width='1.8' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='3'/%3E%3Ccircle cx='11' cy='21' r='3'/%3E%3Cpath d='M23 9 13.2 18.8M19.5 19.5 23 23M13.2 13.2 16 16'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin">
    <aside class="sidebar glass-dark">
      <a class="brand" href="/" id="brand" title="Atvērt mājaslapu"></a>
      <nav id="sideNav" style="display:grid;gap:4px"></nav>
      <div class="bottom">
        <a class="side-link" href="/" target="_blank" rel="noopener" id="siteLink"></a>
        <div class="side-user">
          <span class="avatar" id="adminAvatar">A</span>
          <div style="min-width:0"><b id="adminName">Administrators</b><small id="adminUser"></small></div>
          <button class="icon-btn" id="logoutBtn" title="Iziet" aria-label="Iziet"></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="mobile-top glass">
        <a class="brand" href="/" id="brandMobile"></a>
        <button class="icon-btn" id="logoutBtnM" aria-label="Iziet"></button>
      </div>
      <div id="view"></div>
    </main>
  </div>
  <nav class="mobile-nav glass-dark" id="mobileNav"></nav>

  <script src="/js/common.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
